services:

  # Broker MQTT: recebe a telemetria publicada pelo simulador.
  mqtt:
    image: eclipse-mosquitto:2
    container_name: ra-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  # API Flask: assina o MQTT e responde HTTP/JSON para a WebAR.
  api:
    build: ./backend
    container_name: ra-api
    ports:
      - "5000:5000"
    environment:
      MQTT_HOST: mqtt        # nome do serviço = nome DNS na rede do Compose
      MQTT_PORT: "1883"
      MQTT_TOPIC_ROOT: industria
    depends_on:
      - mqtt
    restart: unless-stopped

  # Simulador: publica dados fictícios periodicamente.
  simulator:
    build: ./simulator
    container_name: ra-simulator
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_TOPIC_ROOT: industria
      EQUIPAMENTO_ID: CNC-01
      INTERVALO_S: "3"
    depends_on:
      - mqtt
    restart: unless-stopped
